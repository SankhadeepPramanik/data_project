sources:
  - name: raw_data
    database: "DBT_SOURCE" 
    schema: "{%- if  target.name == 'dev' -%} SOURCE_SCHEMA {%- else -%} PROD_SOURCE_SCHEMA {%- endif -%}"
    tables:
      - name: "nextgen_order"
        identifier: "ORDER_SORCE"
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 12, period: hour}
        loaded_at_field: "CAST(flow_published_at AS TIMESTAMP)"

        description: "Order  events"
        columns:
          - name: "sequence_number"
            type: string
            description: "kds_uuid"
            tests:
              - unique
              - not_null
          - name: "flow_published_at"
            type: timestamp
            description: "timestamp"
            tests:
              - not_null    
  - name: order_silver
    database: "{%- if  target.name == 'dev' -%} MY_DBT {%- else -%} PROD_DBT {%- endif -%}"
    schema: "audit_log"
    tables:
      - name: "order_cntl_tbl"
  - name: order_log
    database: "{%- if  target.name == 'dev' -%} MY_DBT {%- else -%} PROD_DBT {%- endif -%}"
    schema: "audit_log"
    tables:
      - name: "audit_log_order"
  - name: nextgen_audit
    database: "{%- if  target.name == 'dev' -%} MY_DBT {%- else -%} PROD_DBT {%- endif -%}"
    schema: "audit_log"
    tables:
      - name: "dbt_audit_logs"  